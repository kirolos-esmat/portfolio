<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Scrow Calculator – Score Tracking Made Easy</title>
    <meta
      name="description"
      content="Simple and effective score tracking for multiplayer games. Track scores across multiple rounds with ease."
    />
    <meta
      property="og:title"
      content="Scrow Calculator – Score Tracking Made Easy"
    />
    <meta
      property="og:description"
      content="Simple and effective score tracking for multiplayer games. Track scores across multiple rounds with ease."
    />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/png" href="/favicon.png" />

    <!-- Bebas Neue + Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --bg: #0f0f0f;
        --bg-secondary: #1a1a1a;
        --text-primary: #ffffff;
        --text-secondary: #e0e0e0;
        --text-tertiary: #a0a0a0;
        --accent: #404040;
        --button-primary: #333333;
        --button-primary-hover: #404040;
        --border: #404040;
      }

      body {
        font-family: "Inter", sans-serif;
        background: var(--bg);
        color: var(--text-primary);
        overflow-x: hidden;
        position: relative;
        min-height: 100vh;
      }

      /* Subtle background pattern */
      body::before {
        content: "";
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background:
          radial-gradient(
            circle at 20% 80%,
            rgba(64, 64, 64, 0.1) 0%,
            transparent 50%
          ),
          radial-gradient(
            circle at 80% 20%,
            rgba(64, 64, 64, 0.1) 0%,
            transparent 50%
          );
        z-index: 1;
        pointer-events: none;
      }

      .container {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        padding: 6rem 2rem 2rem;
        position: relative;
        z-index: 2;
      }

      .hero-section {
        max-width: 800px;
        width: 100%;
        margin: 0 auto;
        text-align: center;
        padding: 4rem 0;
        animation: fadeIn 0.8s ease-out;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      h1 {
        font-family: "Bebas Neue", sans-serif;
        font-size: clamp(3rem, 10vw, 6rem);
        letter-spacing: 0.05em;
        line-height: 1;
        margin-bottom: 1.5rem;
        color: var(--text-primary);
        opacity: 0;
        animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards;
      }

      .subtitle {
        font-size: clamp(1.25rem, 3vw, 2rem);
        letter-spacing: 0.02em;
        color: var(--text-tertiary);
        margin-bottom: 3rem;
        font-weight: 300;
        opacity: 0;
        animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.4s forwards;
      }

      .download-buttons {
        display: flex;
        gap: 1rem;
        justify-content: center;
        flex-wrap: wrap;
        margin-bottom: 2rem;
        opacity: 0;
        animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.6s forwards;
      }

      .download-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 18px 32px;
        border-radius: 100px;
        text-decoration: none;
        font-weight: 500;
        font-size: 0.9375rem;
        gap: 12px;
        position: relative;
        overflow: hidden;
        transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      }

      /* App Store - Dark theme */
      .download-btn.app-store {
        background: var(--button-primary);
        color: var(--text-primary);
        border: 2px solid var(--border);
      }
      .download-btn.app-store::before {
        content: "";
        position: absolute;
        top: 50%;
        left: 50%;
        width: 0;
        height: 0;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.1);
        transform: translate(-50%, -50%);
        transition:
          width 0.6s,
          height 0.6s;
      }
      @media (min-width: 481px) {
        .download-btn.app-store:hover::before {
          width: 300px;
          height: 300px;
        }
        .download-btn.app-store:hover {
          transform: translateY(-3px);
          box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
          background: var(--button-primary-hover);
          border-color: var(--text-tertiary);
        }
      }

      /* Google Play - Dark theme (matching App Store style) */
      .download-btn.google-play {
        background: var(--button-primary);
        color: var(--text-primary);
        border: 2px solid var(--border);
      }
      .download-btn.google-play::before {
        content: "";
        position: absolute;
        top: 50%;
        left: 50%;
        width: 0;
        height: 0;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.1);
        transform: translate(-50%, -50%);
        transition:
          width 0.6s,
          height 0.6s;
      }
      @media (min-width: 481px) {
        .download-btn.google-play:hover::before {
          width: 300px;
          height: 300px;
        }
        .download-btn.google-play:hover {
          transform: translateY(-3px);
          box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
          background: var(--button-primary-hover);
          border-color: var(--text-tertiary);
        }
      }

      .download-btn svg {
        width: 20px;
        height: 20px;
        z-index: 1;
      }
      .download-btn span {
        z-index: 1;
      }

      .footer-note {
        color: var(--text-tertiary);
        font-size: 0.9375rem;
        opacity: 0;
        animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.8s forwards;
        margin-top: 1rem;
      }

      .back-home {
        position: fixed;
        top: 2rem;
        left: 2rem;
        z-index: 1000;
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 12px 24px;
        background: var(--button-primary);
        color: var(--text-primary);
        text-decoration: none;
        border-radius: 50px;
        border: 2px solid var(--border);
        font-weight: 500;
        font-size: 0.9375rem;
        transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        opacity: 0;
        animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards;
      }
      @media (min-width: 481px) {
        .back-home:hover {
          background: var(--button-primary-hover);
          border-color: var(--text-tertiary);
          transform: translateY(-2px);
          box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
      }
      .back-home svg {
        width: 18px;
        height: 18px;
      }

      .screenshots-section {
        width: 100%;
        max-width: 1400px;
        margin: 0 auto;
        padding: 4rem 2rem;
      }

      .screenshots-title {
        font-family: "Bebas Neue", sans-serif;
        font-size: clamp(2.5rem, 5vw, 4rem);
        letter-spacing: 0.05em;
        text-align: center;
        margin-bottom: 3rem;
        color: var(--text-primary);
        opacity: 0;
        animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) 1s forwards;
      }

      .gallery {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 2rem;
        justify-items: center;
        opacity: 0;
        animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) 1.2s forwards;
      }

      .gallery-item {
        position: relative;
        width: 100%;
        max-width: 280px;
      }

      .gallery-item::before {
        content: "";
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 200px;
        height: 200px;
        background: radial-gradient(
          circle,
          rgba(255, 255, 255, 0.02) 0%,
          transparent 70%
        );
        border-radius: 50%;
        z-index: -1;
        opacity: 0;
        transition: opacity 0.4s ease;
      }

      @media (min-width: 481px) {
        .gallery-item:hover::before {
          opacity: 1;
        }
      }

      .gallery-item img {
        width: 100%;
        height: auto;
        display: block;
        border-radius: 20px;
        filter: drop-shadow(0 15px 35px rgba(0, 0, 0, 0.5));
        transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        background: var(--bg);
        animation: floatGentle 6s ease-in-out infinite;
      }

      .gallery-item:nth-child(1) img {
        animation-delay: 0s;
      }

      .gallery-item:nth-child(2) img {
        animation-delay: -1.2s;
      }

      .gallery-item:nth-child(3) img {
        animation-delay: -2.4s;
      }

      .gallery-item:nth-child(4) img {
        animation-delay: -3.6s;
      }

      .gallery-item:nth-child(5) img {
        animation-delay: -4.8s;
      }

      @media (min-width: 481px) {
        .gallery-item:hover img {
          transform: translateY(-8px) scale(1.02);
          filter: drop-shadow(0 25px 50px rgba(0, 0, 0, 0.6));
          animation-play-state: paused;
        }
      }

      @keyframes floatGentle {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-12px);
        }
      }

      @media (max-width: 480px) {
        .container {
          padding: 5rem 1.5rem 1.5rem;
        }
        .hero-section {
          padding: 2rem 0;
        }
        .download-buttons {
          flex-direction: column;
          align-items: center;
          width: 100%;
        }
        .download-btn {
          width: 100%;
          max-width: 300px;
        }
        .screenshots-section {
          padding: 3rem 1.5rem;
        }
        .gallery {
          grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
          gap: 1.25rem;
        }
        .gallery-item {
          max-width: 100%;
        }
      }

      @media (max-width: 480px) {
        .container {
          padding: 4rem 1rem 1rem;
        }
        .hero-section {
          padding: 1.5rem 0;
        }
        .back-home {
          top: 1rem;
          left: 1rem;
          padding: 8px 16px;
          font-size: 0.8125rem;
          gap: 0.35rem;
        }
        .back-home svg {
          width: 16px;
          height: 16px;
        }
        .back-home span {
          display: none;
        }
        .screenshots-section {
          padding: 2rem 1rem;
        }
        .gallery {
          grid-template-columns: repeat(2, 1fr);
          gap: 1rem;
        }
        .gallery-item img {
          animation: floatGentle 4s ease-in-out infinite;
        }
      }
    </style>
  </head>
  <body>
    <a href="../index.html" class="back-home">
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M19 12H5M12 19l-7-7 7-7" />
      </svg>
      <span>Back to Home</span>
    </a>

    <div class="container">
      <section class="hero-section">
        <h1>Scrow Calculator</h1>
        <p class="subtitle">Score Tracking Made Easy</p>

        <div class="download-buttons">
          <a
            href="https://play.google.com/store/apps/details?id=com.Hedwig.scrow_calculator"
            class="download-btn google-play"
            aria-label="Get it on Google Play"
            target="_blank"
            rel="noopener noreferrer"
          >
            <svg viewBox="0 0 512 512" fill="currentColor">
              <path
                d="M325.3 234.3L104.6 13l280.8 161.2-60.1 60.1zM47 0C34 6.8 25.3 19.2 25.3 35.3v441.3c0 16.1 8.7 28.5 21.7 35.3l256.6-256L47 0zm425.2 225.6l-58.9-34.1-65.7 64.5 65.7 64.5 60.1-34.1c18-14.3 18-46.5-1.2-60.8zM104.6 499l280.8-161.2-60.1-60.1L69.1 523.9l35.5-24.9z"
              />
            </svg>
            <span>Google Play</span>
          </a>
        </div>

        <p class="footer-note">Created with ❤️ by Kirolos Esmat</p>
      </section>

      <section class="screenshots-section">
        <h2 class="screenshots-title">App Screenshots</h2>
        <div class="gallery">
          <div class="gallery-item">
            <img src="assets/1.png" alt="Screenshot 1" />
          </div>
          <div class="gallery-item">
            <img src="assets/2.png" alt="Screenshot 2" />
          </div>
          <div class="gallery-item">
            <img src="assets/3.png" alt="Screenshot 3" />
          </div>
          <div class="gallery-item">
            <img src="assets/4.png" alt="Screenshot 4" />
          </div>
          <div class="gallery-item">
            <img src="assets/5.png" alt="Screenshot 5" />
          </div>
        </div>
      </section>
    </div>
  </body>
</html>
